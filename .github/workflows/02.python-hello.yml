name: Run hello world from Python
on: push

jobs:
 Hello:
  runs-on: ubuntu-latest
  steps:
    - name: Clone repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Run script
      run: python 01.hello.py
